name: q2276-windows-repro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record runner metadata
        shell: pwsh
        run: |
          "Q2276_RUNNER_PLATFORM=$([System.Environment]::OSVersion.VersionString)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Q2276_NODE_VERSION=$(node --version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Expand final attachments
        shell: pwsh
        run: |
          $inputRoot = Join-Path $env:RUNNER_TEMP q2276-input
          $referenceRoot = Join-Path $env:RUNNER_TEMP q2276-reference
          Expand-Archive -LiteralPath task\输入数据包.zip -DestinationPath $inputRoot
          Expand-Archive -LiteralPath task\reference.zip -DestinationPath $referenceRoot
          "Q2276_INPUT_ROOT=$inputRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Q2276_REFERENCE_ROOT=$referenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete Windows reproduction
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd,'implementation')); addpath(fullfile(pwd,'qa')); windows_verify(fullfile(pwd,'task'),string(getenv('Q2276_INPUT_ROOT')),string(getenv('Q2276_REFERENCE_ROOT')),fullfile(pwd,'implementation'),fullfile(pwd,'qa-output'))

      - name: Upload independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: q2276-windows-evidence
          path: qa-output
          if-no-files-found: error
