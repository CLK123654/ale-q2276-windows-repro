name: Build reference with MATLAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - name: Run MATLAB implementation
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("implementation"); run_cure_review("input","reference")
      - name: Upload generated reference
        uses: actions/upload-artifact@v4
        with:
          name: q2276-reference
          path: reference
          if-no-files-found: error
